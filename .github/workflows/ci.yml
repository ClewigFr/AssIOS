name: CI

on:
  push:
    branches: [master]
  pull_request:

# Pull requests from forks run with a read-only token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Package, iOS and tvOS
        run: |
          xcodebuild -scheme AnonymousSimpleStats -destination 'generic/platform=iOS Simulator' -quiet build
          xcodebuild -scheme AnonymousSimpleStats -destination 'generic/platform=tvOS Simulator' -quiet build
      - name: Example app
        run: xcodebuild -project Example/AssExample.xcodeproj -scheme AssExample -destination 'generic/platform=iOS Simulator' -quiet build
